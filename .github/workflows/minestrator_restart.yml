name: Minestrator-Restart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小时自动触发一次，按需调整或删除
    
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh

      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          echo "✅ GOST 已启动，测试连通性..."
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org | sed 's/\.[0-9]*$/.**/' && echo

      - name: 🔧 执行启动脚本
        env:
          MSR_ACCOUNT: ${{ secrets.MSR_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: bash minestrator_restart.sh

      - name: 📤 推回私库（如有 token 更新）
        if: always()
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cp minestrator_restart.sh private/minestrator_restart.sh
          cd private
          if ! git diff --quiet; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add minestrator_restart.sh
            git commit -m "🔄 自动更新 API_KEY_B64"
            git push "https://${PRIVATE_REPO_TOKEN}@github.com/${{ github.repository_owner }}/Minestrator-Start-Private.git" HEAD
            echo "✅ 已推回私库"
          else
            echo "ℹ️ token 无变化，无需推送"
          fi
